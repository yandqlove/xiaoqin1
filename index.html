<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="robots" content="noindex,nofollow">
<!-- 优化 #14：PWA 图标（有 assets/icon.png 才生效，没有可删） -->
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="icon" href="assets/icon.png">
<title>Qin Bao Bao Happy Birthday 🎂</title>
<style>
:root{
  --gold:#ffd89b;
  --rose:#ff6b9d;
  --violet:#c471ed;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:#07060f;color:#fff;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  /* 优化 #8：iPhone 底部安全区，防止被小白条挡住 */
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* =========================================================
   优化 #11：首屏 loading
   ========================================================= */
.loader{
  position:fixed;inset:0;z-index:100;
  background:#07060f;
  transition:opacity .8s ease;
  pointer-events:none;
}
.loader.gone{opacity:0}
.loader::after{
  content:'';
  position:absolute;top:50%;left:50%;
  width:32px;height:32px;
  margin:-16px 0 0 -16px;
  border:2px solid rgba(255,216,155,.18);
  border-top-color:#ffd89b;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

/* =========================================================
   背景（暖 / 冷 两套）
   ========================================================= */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 15% -10%, #2a1150 0%, transparent 60%),
    radial-gradient(900px 700px at 95% 10%, #43103a 0%, transparent 55%),
    radial-gradient(1100px 900px at 50% 115%, #0d1b3d 0%, transparent 62%),
    linear-gradient(180deg,#07060f 0%,#0d0819 55%,#120a1e 100%);
}
.bg-cold{
  background:
    radial-gradient(1200px 800px at 15% -10%, #0a2050 0%, transparent 60%),
    radial-gradient(900px 700px at 95% 10%, #2b0f5e 0%, transparent 55%),
    radial-gradient(1100px 900px at 50% 115%, #041830 0%, transparent 62%),
    linear-gradient(180deg,#050510 0%,#080f24 55%,#0a0a1e 100%);
  opacity:0;transition:opacity 1.8s ease;
}
body.cold .bg-cold{opacity:1}

.orbs{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;
  transition:background 1.8s ease}
.o1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:#7b2ff7;opacity:.42;animation:f1 24s ease-in-out infinite}
.o2{width:36vmax;height:36vmax;right:-12vmax;top:6vmax;background:#ff2e88;opacity:.38;animation:f2 28s ease-in-out infinite}
.o3{width:40vmax;height:40vmax;left:18vmax;bottom:-22vmax;background:#ffa53c;opacity:.24;animation:f3 32s ease-in-out infinite}
body.cold .o1{background:#3b6fff;opacity:.46}
body.cold .o2{background:#7b2ff7;opacity:.42}
body.cold .o3{background:#00d4ff;opacity:.28}
@keyframes f1{50%{transform:translate3d(9vmax,7vmax,0) scale(1.16)}}
@keyframes f2{50%{transform:translate3d(-8vmax,10vmax,0) scale(1.1)}}
@keyframes f3{50%{transform:translate3d(7vmax,-9vmax,0) scale(1.2)}}

#stars{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#hearts{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* =========================================================
   密码锁
   ========================================================= */
.lock{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;
  transition:opacity .9s ease,visibility .9s}
.lock.gone{opacity:0;visibility:hidden;pointer-events:none}
.lock-card{position:relative;width:min(90vw,380px);padding:38px 26px 30px;text-align:center;border-radius:28px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.lock-icon{font-size:30px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 0 18px rgba(255,216,155,.6))}
.lock-card h2{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:.06em;
  background:linear-gradient(100deg,#fff1cf,var(--gold) 40%,var(--rose));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lock-sub{margin:0;font-size:12.5px;color:rgba(255,255,255,.5);letter-spacing:.16em}
.pin{display:flex;gap:12px;justify-content:center;margin:26px 0 12px}
.pin input{width:56px;height:64px;text-align:center;font-size:26px;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.18);border-radius:16px;outline:none;
  caret-color:var(--gold);transition:.25s}
.pin input:focus{border-color:var(--gold);background:rgba(255,216,155,.08);
  box-shadow:0 0 0 4px rgba(255,216,155,.14), 0 0 24px rgba(255,216,155,.35)}
.pin-error{min-height:18px;font-size:12.5px;color:var(--rose);letter-spacing:.08em}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* =========================================================
   主内容
   ========================================================= */
.main{position:relative;z-index:10;width:100%;max-width:560px;padding:64px 24px 60px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
  opacity:0;transform:translateY(26px);
  transition:opacity 1.1s ease .3s, transform 1.1s cubic-bezier(.2,.9,.3,1.2) .3s;
  pointer-events:none}
.main.show{opacity:1;transform:none;pointer-events:auto}

.hero{text-align:center}
.eyebrow{margin:0 0 10px;font-size:11px;letter-spacing:.42em;text-indent:.42em;color:rgba(255,255,255,.5);text-transform:uppercase}
.title{margin:0;font-family:"Didot","Bodoni MT","Playfair Display",Georgia,"Songti SC","STSong",serif;
  font-size:clamp(34px,9vw,58px);font-weight:700;letter-spacing:.02em;
  background:linear-gradient(100deg,#fff1cf,#ffd89b 25%,#ff8fb8 50%,#c9a0ff 75%,#fff1cf);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shine 7s linear infinite;filter:drop-shadow(0 6px 26px rgba(255,150,200,.35))}
@keyframes shine{to{background-position:220% 0}}
.date{margin:10px 0 0;font-size:12px;letter-spacing:.36em;color:rgba(255,255,255,.42)}

/* 倒计时 */
.countdown{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cd-item{min-width:56px;padding:10px 12px;border-radius:14px;text-align:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cd-num{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#fff1cf,#ffd89b 50%,#ff8fb8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cd-label{display:block;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.5);margin-top:2px}
.countdown.today{display:block;font-size:15px;letter-spacing:.2em;color:var(--gold);text-align:center;
  padding:12px 20px;border-radius:14px;background:rgba(255,216,155,.08);
  border:1px solid rgba(255,216,155,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,216,155,.4)}}

/* 相册 */
.stage{display:grid;place-items:center}
.gallery-wrap{position:relative;padding:3px;border-radius:26px}
.halo{position:absolute;inset:-8px;border-radius:34px;
  background:conic-gradient(from 0deg,#ffd89b,#ff6b9d,#c471ed,#7ee8fa,#ffd89b);
  filter:blur(24px);opacity:.5;z-index:0;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gallery{position:relative;z-index:1;width:min(68vw,290px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;
  /* 优化 #3：图片加载失败兜底渐变 */
  background:linear-gradient(135deg,#2a1150,#43103a,#0d1b3d);
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12)}
.gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;
  transform:scale(1.3) translate(4%, 3%);
  transition:opacity 1.5s ease;
  will-change:opacity,transform;
  filter:brightness(.96) saturate(1.08)}
.gallery img.on{
  opacity:1;
  animation:kenburns 14s cubic-bezier(.2,.6,.25,1) forwards;
}
@keyframes kenburns{
  0%{transform:scale(1.3) translate(4%, 3%)}
  100%{transform:scale(1.06) translate(-2%, -1.6%)}
}
.gallery img:nth-child(2n).on{animation-name:kenburns-2}
@keyframes kenburns-2{
  0%{transform:scale(1.3) translate(-4%, 2%)}
  100%{transform:scale(1.06) translate(2%, -1.6%)}
}
.gallery img:nth-child(3n).on{animation-name:kenburns-3}
@keyframes kenburns-3{
  0%{transform:scale(1.28) translate(2%, -3%)}
  100%{transform:scale(1.06) translate(-1.6%, 2%)}
}

/* 蛋糕 */
.cake-wrap{margin-top:4px;text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.cake{position:relative;width:160px;height:150px;margin:0 auto}
.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:180px;height:14px;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.05));
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.bot-layer,.mid-layer,.top-layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:6px 6px 4px 4px}
.bot-layer{bottom:12px;width:150px;height:38px;background:linear-gradient(180deg,#ff8fb8,#ff5f8f);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.15), 0 4px 12px rgba(255,95,143,.4)}
.bot-layer::before,.mid-layer::before,.top-layer::before{content:'';position:absolute;top:-1px;left:0;right:0;
  background:linear-gradient(180deg,#fff5e0,#ffe9c4);border-radius:6px 6px 0 0}
.bot-layer::before{height:8px}
.mid-layer{bottom:48px;width:120px;height:32px;background:linear-gradient(180deg,#ffd89b,#ffb85c);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.1), 0 4px 12px rgba(255,184,92,.3)}
.mid-layer::before{height:7px}
.top-layer{bottom:78px;width:90px;height:26px;background:linear-gradient(180deg,#c471ed,#a04fd4);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.15), 0 4px 12px rgba(196,113,237,.35)}
.top-layer::before{height:6px}
.candle{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);width:8px;height:28px;
  background:linear-gradient(90deg,#fff,#ffd89b 50%,#e8b86d);border-radius:3px;
  box-shadow:0 0 10px rgba(255,216,155,.6)}
.wick{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:2px;height:6px;background:#3a2a1a}
.flame{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:12px;height:18px;
  background:radial-gradient(ellipse at center bottom,#fff8d0,#ffd54a 40%,#ff8a00 70%,transparent);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow:0 0 24px #ffb84a, 0 0 40px rgba(255,138,0,.5);
  animation:flicker .4s ease-in-out infinite alternate;transition:.6s ease}
@keyframes flicker{from{transform:translateX(-50%) scale(1) rotate(-2deg)}to{transform:translateX(-50%) scale(1.1) rotate(2deg)}}
.cake-wrap.blown .flame{opacity:0;transform:translateX(-50%) scale(0)}
.cake-hint{margin:14px 0 0;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.1em;transition:.4s}
.cake-wrap.blown .cake-hint{color:var(--gold)}

/* 打字机 */
.typed-wrap{min-height:2.8em;padding:0 20px;text-align:center;font-size:clamp(14px,4vw,17px);
  letter-spacing:.06em;color:rgba(255,255,255,.86);line-height:1.7}
.caret{display:inline-block;width:1px;height:1em;margin-left:3px;background:var(--gold);
  vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.foot{font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.32);text-transform:uppercase}

/* 留言板 */
.board{width:100%;max-width:440px;margin-top:10px;padding:22px 22px 20px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.board h3{margin:0 0 4px;font-size:14px;font-weight:600;letter-spacing:.14em;
  background:linear-gradient(100deg,#fff1cf,var(--gold),var(--rose));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.board-sub{margin:0 0 14px;font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.08em}
.board textarea,.board input[type="text"]{
  width:100%;font-family:inherit;font-size:14px;color:#fff;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.15);
  border-radius:12px;padding:11px 13px;outline:none;transition:.25s;resize:none;
  caret-color:var(--gold);
}
.board textarea{min-height:84px;line-height:1.6}
.board textarea:focus,.board input[type="text"]:focus{
  border-color:var(--gold);background:rgba(255,216,155,.06);
  box-shadow:0 0 0 3px rgba(255,216,155,.12)}
.board input[type="text"]{margin-top:10px}
.board-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.board button{
  flex:1;padding:11px 20px;border:none;border-radius:12px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.16em;color:#1a0d24;
  background:linear-gradient(100deg,#ffd89b,#ff8fb8 60%,#c471ed);
  box-shadow:0 8px 22px rgba(255,143,184,.35);
  transition:.25s;
}
.board button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 28px rgba(255,143,184,.5)}
.board button:disabled{opacity:.55;cursor:not-allowed}
.board-status{min-height:16px;margin:10px 0 0;font-size:12px;letter-spacing:.06em;text-align:center}
.board-status.ok{color:#8be6b8}
.board-status.err{color:var(--rose)}

/* =========================================================
   顶部按钮容器（音乐 / 分享）
   ========================================================= */
.top-actions{
  position:fixed;top:16px;right:16px;z-index:50;
  display:none;gap:8px;align-items:center;
}
.top-actions.show{display:flex}

.music-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 15px 9px 12px;border-radius:999px;font-size:12.5px;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;transition:.25s}
.music-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,216,155,.55)}
.music-btn.need-tap{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,107,157,.2)}
.disc{display:inline-block;font-size:14px;color:var(--gold);animation:spin 4s linear infinite}

/* 优化 #13：分享按钮 */
.share-btn{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;
  font-size:15px;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  cursor:pointer;transition:.25s;
}
.share-btn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,216,155,.55);transform:scale(1.05)}

/* 频谱 */
#viz{position:fixed;right:16px;bottom:16px;z-index:50;
  width:118px;height:40px;padding:4px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transition:opacity .6s ease;pointer-events:none}
#viz.show{opacity:.9}
/* 优化 #6：移动端频谱变小 */
@media (max-width: 640px){
  #viz{width:90px;height:32px;right:12px;bottom:12px}
}

/* 爆照粒子 */
.burst-photo{position:fixed;width:60px;height:80px;object-fit:cover;border-radius:8px;
  pointer-events:none;z-index:30;border:2px solid rgba(255,255,255,.35);
  box-shadow:0 8px 24px rgba(0,0,0,.6);will-change:transform,opacity}

/* 惊喜模式 */
.surprise{
  position:fixed;inset:0;z-index:70;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:24px;
  background:rgba(3,2,10,.94);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  opacity:0;visibility:hidden;
  transition:opacity .6s ease, visibility .6s ease;
}
.surprise.show{opacity:1;visibility:visible}
.surprise-img{
  position:relative;
  width:min(86vw,420px);aspect-ratio:3/4;
  border-radius:24px;overflow:hidden;
  background:linear-gradient(135deg,#2a1150,#43103a,#0d1b3d);
  box-shadow:0 0 80px rgba(255,143,184,.45), 0 0 0 1px rgba(255,255,255,.15);
}
.surprise-img img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.2s ease, transform 8s ease-out;
  transform:scale(1.08);
}
.surprise-img img.on{opacity:1;transform:scale(1)}
.surprise-text{
  margin:0;font-size:15px;letter-spacing:.16em;
  color:rgba(255,255,255,.85);text-align:center;
  min-height:1.6em;
  transition:opacity .4s ease;
}
.surprise-close{
  position:absolute;top:18px;right:18px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.25s;
}
.surprise-close:hover{background:rgba(255,255,255,.18);transform:rotate(90deg)}
.surprise-hint{
  position:absolute;bottom:22px;left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.35);
  text-transform:uppercase;
}
</style>
</head>
<body>

<!-- 优化 #11：loading 遮罩 -->
<div class="loader" id="loader"></div>

<div class="bg"></div>
<div class="bg bg-cold"></div>
<div class="orbs" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
</div>
<canvas id="stars"></canvas>
<canvas id="hearts"></canvas>

<!-- 密码锁 -->
<div class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>请输入专属密码</h2>
    <p class="lock-sub">4 位数字 · 你知道的</p>
    <div class="pin" id="pin">
      <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
      <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
      <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
      <input type="password" maxlength="1" inputmode="numeric" autocomplete="off">
    </div>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- 主内容 -->
<main class="main" id="main" aria-hidden="true">
  <header class="hero">
    <p class="eyebrow">Happy Birthday</p>
    <h1 class="title">To 秦宝宝 ♡</h1>
    <p class="date">2026 · 08 · 08</p>
  </header>

  <div class="countdown" id="countdown"></div>

  <section class="stage">
    <div class="gallery-wrap">
      <div class="halo"></div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <div class="cake-wrap" id="cake">
    <div class="cake">
      <div class="candle">
        <div class="flame"></div>
        <div class="wick"></div>
      </div>
      <div class="top-layer"></div>
      <div class="mid-layer"></div>
      <div class="bot-layer"></div>
      <div class="plate"></div>
    </div>
    <p class="cake-hint" id="cakeHint">点一下蛋糕，许个愿 ✨</p>
  </div>

  <p class="typed-wrap"><span id="typed"></span><span class="caret"></span></p>

  <!-- 留言板 -->
  <section class="board" id="board">
    <h3>想对我说的话</h3>
    <p class="board-sub">发送后会直接到达我这里 ♡</p>

/* =========================================================

   ========================================================= */
(function starfield(){
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  let W=0,H=0, stars=[], meteors=[];

  function resize(){
    W = cv.width  = Math.floor(innerWidth  * DPR);
    H = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width  = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    stars = Array.from({length: MAX_STARS}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.5 + 0.3) * DPR,
      a: Math.random(), s: Math.random() * 0.016 + 0.003,
      hue: Math.random() < 0.25 ? 40 : 0
    }));
  }
  function spawnMeteor(){
    if (pageHidden) return;                       // 优化 #2
    if (meteors.length > 2) return;
    meteors.push({
      x: Math.random() * W * 0.8, y: Math.random() * H * 0.35,
      len: (Math.random() * 160 + 120) * DPR,
      vx: (Math.random() * 5 + 6) * DPR,
      vy: (Math.random() * 3 + 3) * DPR,
      life: 1
    });
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const s of stars){
      s.a += s.s;
      const alpha = 0.35 + Math.abs(Math.sin(s.a)) * 0.65;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.hue === 40 ? `rgba(255,216,155,${alpha})` : `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    for (let i = meteors.length - 1; i >= 0; i--){
      const m = meteors[i];
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.len * 0.7, m.y - m.len * 0.45);
      g.addColorStop(0, `rgba(255,255,255,${0.85 * m.life})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6 * DPR;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.len * 0.7, m.y - m.len * 0.45);
      ctx.stroke();
      m.x += m.vx; m.y += m.vy; m.life -= 0.008;
      if (m.life <= 0 || m.x > W + 200 || m.y > H + 200) meteors.splice(i, 1);
    }
    requestAnimationFrame(draw);
  }
  resize();
  addEventListener('resize', resize);
  setInterval(spawnMeteor, 2600);
  draw();
})();

/* =========================================================
   3. 爱心雨 + 点击涟漪变色
   ========================================================= */
(function heartRain(){
  const cv = document.getElementById('hearts');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const rain = [];
  const bursts = [];
  const ripples = [];

  const COLORS = ['#ff6b9d','#ffd89b','#c471ed','#ff8fb8','#7ee8fa','#ff5f8f'];
  const pick = () => COLORS[Math.floor(Math.random() * COLORS.length)];

  function resize(){
    W = cv.width  = Math.floor(innerWidth  * DPR);
    H = cv.height = Math.floor(innerHeight * DPR);
    cv.style.width  = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize);

  function spawnHeart(){
    if (pageHidden) return;                       // 优化 #2
    if (rain.length >= MAX_HEARTS) return;        // 优化 #9：上限
    rain.push({
      x: Math.random() * W,
      y: -30 * DPR,
      size: (Math.random() * 12 + 8) * DPR,
      vy: (Math.random() * 1.6 + 1.1) * DPR,
      vx: (Math.random() - 0.5) * 0.7 * DPR,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      alpha: Math.random() * 0.45 + 0.45,
      color: pick(),
      scale: 1,
      flash: 0
    });
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // 涟漪
    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i];
      rp.r += rp.speed;
      rp.life -= 0.014;
      if (rp.life <= 0 || rp.r > rp.maxR){ ripples.splice(i, 1); continue; }

      const band = 32 * DPR;
      for (const h of rain){
        const dx = h.x - rp.x, dy = h.y - rp.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (Math.abs(dist - rp.r) < band){
          h.color = rp.color;
          h.scale = Math.max(h.scale, 1.6);
          h.flash = 1;
        }
      }

      ctx.save();
      ctx.globalAlpha = rp.life * 0.85;
      ctx.strokeStyle = rp.color;
      ctx.lineWidth = (2 + rp.life * 5) * DPR;
      ctx.shadowColor = rp.color;
      ctx.shadowBlur = 26 * DPR;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = rp.life * 0.4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4 * DPR;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r * 0.86, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 爱心雨
    for (let i = rain.length - 1; i >= 0; i--){
      const h = rain[i];
      h.x += h.vx; h.y += h.vy; h.rot += h.vr;
      if (h.scale > 1) h.scale -= 0.022; else h.scale = 1;
      if (h.flash > 0) h.flash -= 0.045; else h.flash = 0;
      if (h.y > H + 50 * DPR){ rain.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.scale(h.scale, h.scale);
      ctx.globalAlpha = Math.min(1, h.alpha + h.flash * 0.5);
      ctx.font = `${h.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = h.color;
      ctx.shadowColor = h.color;
      ctx.shadowBlur = (10 + h.flash * 34) * DPR;
      ctx.fillText('♥', 0, 0);
      ctx.restore();
    }

    // 爆开粒子
    for (let i = bursts.length - 1; i >= 0; i--){
      const p = bursts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.09 * DPR;
      p.life -= 0.018;
      if (p.life <= 0){ bursts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 15 * DPR;
      ctx.fillText('♥', p.x, p.y);
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  draw();

  window.__startHearts = function(){
    if (!window.__heartTimer){
      window.__heartTimer = setInterval(spawnHeart, HEART_INTERVAL);
    }
  };

  let burstAlive = 0;

  window.__clickFx = function(clientX, clientY){
    if (!unlocked) return;
    const cx = clientX * DPR, cy = clientY * DPR;

    ripples.push({
      x: cx, y: cy,
      r: 6 * DPR,
      maxR: 340 * DPR,
      speed: 9 * DPR,
      life: 1,
      color: pick()
    });

    for (let i = 0; i < 12; i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 6 + 3) * DPR;
      bursts.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2 * DPR,
        size: (Math.random() * 10 + 8) * DPR,
        life: 1,
        color: pick()
      });
    }

    if (burstAlive < MAX_BURST_PHOTO && PHOTOS.length){
      const img = document.createElement('img');
      img.src = PHOTOS[Math.floor(Math.random() * PHOTOS.length)];
      img.className = 'burst-photo';
      img.style.left = clientX + 'px';
      img.style.top  = clientY + 'px';
      document.body.appendChild(img);
      burstAlive++;

      const dx = (Math.random() - 0.5) * 200;
      const dy = -(Math.random() * 160 + 80);
      const rot = Math.random() * 60 - 30;

      img.animate([
        { opacity: 0, transform: 'translate(-50%,-50%) scale(0.3) rotate(0deg)' },
        { opacity: 1, offset: 0.2 },
        { opacity: 0, transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1) rotate(${rot}deg)` }
      ], { duration: 1500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' })
        .onfinish = () => { img.remove(); burstAlive--; };
    }
  };

  document.addEventListener('click', (e) => {
    if (suppressClick){ suppressClick = false; return; }
    if (!unlocked) return;
    // 排除交互区域
    if (e.target.closest && e.target.closest(
      '.surprise, .board, .top-actions, .music-btn, .share-btn, .cake-wrap, input, textarea, button'
    )) return;
    buzz();
    window.__clickFx(e.clientX, e.clientY);
  });
})();

/* =========================================================
   4. 照片轮播 + Ken Burns
   ========================================================= */
(function gallery(){
  const box = document.getElementById('gallery');
  PHOTOS.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'photo ' + (i + 1);
    img.loading = i === 0 ? 'eager' : 'lazy';
    // 优化 #3：图片加载失败隐藏
    img.onerror = () => {
      img.style.display = 'none';
      console.warn('图片加载失败:', src);
    };
    if (i === 0) img.classList.add('on');
    box.appendChild(img);
  });

  const imgs = box.querySelectorAll('img');
  let idx = 0;
  let autoTimer = null;

  function goTo(nextIdx){
    if (imgs.length < 2) return;
    const cur = imgs[idx];
    if (cur) cur.classList.remove('on');
    idx = (nextIdx + imgs.length) % imgs.length;
    const next = imgs[idx];
    next.classList.remove('on');
    void next.offsetWidth;
    next.classList.add('on');
  }
  function next(){
    if (pageHidden) return;                       // 优化 #2
    goTo(idx + 1);
  }
  function startAuto(){
    stopAuto();
    autoTimer = setInterval(next, 4200);
  }
  function stopAuto(){
    if (autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  }

  window.__galleryNext = function(){ next(); startAuto(); };
  window.__galleryReset = function(){ goTo(0); startAuto(); };

  startAuto();
})();

/* =========================================================
   5. 倒计时
   ========================================================= */
(function countdown(){
  const box = document.getElementById('countdown');
  const pad = n => String(n).padStart(2, '0');

  function tick(){
    if (pageHidden) return;                       // 优化 #2
    const now = new Date();
    const isToday = now.getMonth() === BIRTHDAY_MONTH - 1
                 && now.getDate()  === BIRTHDAY_DAY;

    if (isToday){
      box.classList.add('today');
      box.innerHTML = '🎂 今天就是你的生日 🎂';
      return;
    }
    box.classList.remove('today');

    let target = new Date(now.getFullYear(), BIRTHDAY_MONTH - 1, BIRTHDAY_DAY);
    if (target < now) target.setFullYear(target.getFullYear() + 1);

    const diff = Math.max(0, Math.floor((target - now) / 1000));
    const d = Math.floor(diff / 86400);
    const h = Math.floor((diff % 86400) / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;

    if (box.dataset.mode !== 'cd'){
      box.dataset.mode = 'cd';
      box.innerHTML = `
        <div class="cd-item"><span class="cd-num" id="cdD">00</span><span class="cd-label">天</span></div>
        <div class="cd-item"><span class="cd-num" id="cdH">00</span><span class="cd-label">时</span></div>
        <div class="cd-item"><span class="cd-num" id="cdM">00</span><span class="cd-label">分</span></div>
        <div class="cd-item"><span class="cd-num" id="cdS">00</span><span class="cd-label">秒</span></div>`;
    }
    document.getElementById('cdD').textContent = pad(d);
    document.getElementById('cdH').textContent = pad(h);
    document.getElementById('cdM').textContent = pad(m);
    document.getElementById('cdS').textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);
})();

function startTyping(){

  (function tick(){
    if (pageHidden){ setTimeout(tick, 300); return; }   // 优化 #2
    const cur = LINES[li];

/* =========================================================
   8. 音乐 + 频谱
   ========================================================= */
const audio = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const trackName = document.getElementById('trackName');
const vizCanvas = document.getElementById('viz');
const vizCtx = vizCanvas.getContext('2d');
let trackIdx = 0;
let analyser = null, dataArray = null, vizReady = false;
let audioCtx = null;

function loadTrack(i){
  trackIdx = (i + TRACKS.length) % TRACKS.length;
  audio.src = TRACKS[trackIdx].src;
  trackName.textContent = TRACKS[trackIdx].name;
  applyTheme(trackIdx);
}

function applyTheme(idx){
  const cold = !!(TRACKS[idx] && TRACKS[idx].cold);
  document.body.classList.toggle('cold', cold);
}

// 优化 #10：预加载下一首
function preloadNext(){
  const next = (trackIdx + 1) % TRACKS.length;
  const link = document.createElement('link');
  link.rel = 'prefetch';
  link.as = 'audio';
  link.href = TRACKS[next].src;
  document.head.appendChild(link);
}

function initVisualizer(){
  if (vizReady) return;
  vizReady = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    const src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);

    function resizeViz(){
      const cssW = isMobile ? 90 : 118;
      const cssH = isMobile ? 32 : 40;
      vizCanvas.width  = cssW * DPR;
      vizCanvas.height = cssH * DPR;
      vizCanvas.style.width  = cssW + 'px';
      vizCanvas.style.height = cssH + 'px';
    }
    resizeViz();
    addEventListener('resize', resizeViz);

    (function drawViz(){
      requestAnimationFrame(drawViz);
      if (!analyser || pageHidden) return;        // 优化 #2
      const w = vizCanvas.width, h = vizCanvas.height;
      analyser.getByteFrequencyData(dataArray);
      vizCtx.clearRect(0, 0, w, h);

      const bars = isMobile ? 20 : 28;
      const gap  = 2 * DPR;
      const bw   = (w - (bars - 1) * gap - 8 * DPR) / bars;
      const step = Math.floor(dataArray.length / bars);

      for (let i = 0; i < bars; i++){
        let sum = 0;
        for (let j = 0; j < step; j++) sum += dataArray[i * step + j];
        const v = (sum / step) / 255;
        const bh = Math.max(2 * DPR, v * (h - 8 * DPR));
        const x = 4 * DPR + i * (bw + gap);
        const y = h - 4 * DPR - bh;

        const grad = vizCtx.createLinearGradient(0, y, 0, h - 4 * DPR);
        grad.addColorStop(0, '#ffd89b');
        grad.addColorStop(0.5, '#ff8fb8');
        grad.addColorStop(1, '#c471ed');
        vizCtx.fillStyle = grad;
        vizCtx.shadowColor = 'rgba(255,143,184,.5)';
        vizCtx.shadowBlur = 6 * DPR;
        vizCtx.beginPath();
        if (vizCtx.roundRect){
          vizCtx.roundRect(x, y, bw, bh, bw / 2);
        } else {
          vizCtx.rect(x, y, bw, bh);
        }
        vizCtx.fill();
      }
    })();

    vizCanvas.classList.add('show');
  } catch (err){
    // 优化 #4：彻底关闭频谱，避免再次尝试
    console.warn('频谱初始化失败（可能是音频跨域）:', err);
    vizReady = true;
    vizCanvas.style.display = 'none';
  }
}

function playTrack(i){
  loadTrack(i);
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  audio.play()
    .then(() => {
      musicBtn.classList.remove('need-tap');
      initVisualizer();
      preloadNext();                              // 优化 #10
    })
    .catch(() => {
      musicBtn.classList.add('need-tap');
      trackName.textContent = '点击播放音乐';
    });
}

musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  buzz(8);
  playTrack(trackIdx + 1);
  if (window.__galleryNext) window.__galleryNext();
});

(function messageBoard(){
  const board = document.getElementById('board');
  const btn   = document.getElementById('msgSend');
  const text  = document.getElementById('msgText');
  const from  = document.getElementById('msgFrom');
  const status= document.getElementById('msgStatus');

  board.addEventListener('click', e => e.stopPropagation());
  board.addEventListener('mousedown', e => e.stopPropagation());
  board.addEventListener('touchstart', e => e.stopPropagation(), {passive:true});

  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const msg = text.value.trim();
    if (!msg){
      status.className = 'board-status err';
      status.textContent = '还没写什么呢～';
      return;
    }
    if (WEB3FORMS_KEY === 'YOUR_ACCESS_KEY_HERE'){
      status.className = 'board-status err';
      status.textContent = '还没配置 Web3Forms Key';
      return;
    }

    btn.disabled = true;
    status.className = 'board-status';
    status.textContent = '正在发送...';

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject:    '来自生日页面的留言 💌',
          from_name:  from.value.trim() || '匿名',
          message:    msg,
          page:       location.href
        })
      });
      const data = await res.json();
      if (data.success){
        status.className = 'board-status ok';
        status.textContent = '已送达 ♡ 他一定很开心';
        text.value = '';
        from.value = '';
      } else {
        throw new Error(data.message || '发送失败');
      }
    } catch (err){
      status.className = 'board-status err';
      status.textContent = '发送失败，稍后再试试～';
      console.warn(err);
    } finally {
      btn.disabled = false;
    }
  });
})();

/* =========================================================
   10. 惊喜模式
   ========================================================= */
(function surprise(){
  const overlay = document.getElementById('surprise');
  const imgBox  = document.getElementById('surpriseImg');
  const textEl  = document.getElementById('surpriseText');
  const closeBtn= document.getElementById('surpriseClose');

  PHOTOS.forEach((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'surprise ' + (i + 1);
    img.onerror = () => { img.style.display = 'none'; };   // 优化 #3
    if (i === 0) img.classList.add('on');
    imgBox.appendChild(img);
  });
  const sImgs = imgBox.querySelectorAll('img');

  let sIdx = 0, sTimer = null, tIdx = 0, tTimer = null;
  let shown = false;

  function startLoop(){
    stopLoop();
    sTimer = setInterval(() => {
      if (pageHidden) return;                     // 优化 #2
      sImgs[sIdx].classList.remove('on');
      sIdx = (sIdx + 1) % sImgs.length;
      sImgs[sIdx].classList.add('on');
      buzz(6);
    }, 3000);

    textEl.textContent = SURPRISE_TEXTS[0];
    textEl.style.opacity = 1;
    tIdx = 1;
    tTimer = setInterval(() => {
      if (pageHidden) return;                     // 优化 #2
      textEl.style.opacity = 0;
      setTimeout(() => {
        textEl.textContent = SURPRISE_TEXTS[tIdx % SURPRISE_TEXTS.length];
        textEl.style.opacity = 1;
        tIdx++;
      }, 400);
    }, 4000);
  }
  function stopLoop(){
    if (sTimer){ clearInterval(sTimer); sTimer = null; }
    if (tTimer){ clearInterval(tTimer); tTimer = null; }
  }

  window.__enterSurprise = function(){
    if (!unlocked || shown) return;
    shown = true;
    overlay.classList.add('show');
    sIdx = 0;
    sImgs.forEach((im, i) => im.classList.toggle('on', i === 0));
    startLoop();
    buzz(20);
  };
  function exitSurprise(){
    if (!shown) return;
    shown = false;
    overlay.classList.remove('show');
    stopLoop();
  }

  closeBtn.addEventListener('click', (e) => { e.stopPropagation(); exitSurprise(); });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) exitSurprise(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') exitSurprise(); });

  /* ---------- 长按检测 ---------- */
  const LONG_MS = 650;
  let pressTimer = null;
  let moved = false;
  let startX = 0, startY = 0;

  function isInteractive(el){
    return !!(el && el.closest && el.closest(
      '.board, .top-actions, .music-btn, .share-btn, .cake-wrap, .surprise, input, textarea, button, a'
    ));
  }
  function beginPress(x, y){
    moved = false;
    startX = x; startY = y;
    clearPress();
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (moved) return;
      suppressClick = true;
      window.__enterSurprise();
    }, LONG_MS);
  }
  function clearPress(){
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  }

  // 优化 #1：触屏长按排除输入框/按钮，单指，阈值加大
  document.addEventListener('touchstart', (e) => {
    if (!unlocked) return;
    if (e.touches.length !== 1) return;
    if (isInteractive(e.target)) return;
    const t = e.touches[0];
    beginPress(t.clientX, t.clientY);
  }, {passive:true});

  document.addEventListener('touchmove', (e) => {
    if (pressTimer){
      const t = e.touches[0];
      if (Math.hypot(t.clientX - startX, t.clientY - startY) > MOVE_THRESHOLD){
        moved = true;
        clearPress();
      }
    }
  }, {passive:true});

  document.addEventListener('touchend', clearPress, {passive:true});
  document.addEventListener('touchcancel', clearPress, {passive:true});

  // 桌面长按
  document.addEventListener('mousedown', (e) => {
    if (!unlocked) return;
    if (e.button !== 0) return;
    if (isInteractive(e.target)) return;
    beginPress(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', (e) => {
    if (pressTimer){
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > MOVE_THRESHOLD){
        moved = true;
        clearPress();
      }
    }
  });
  document.addEventListener('mouseup', clearPress);
})();

/* =========================================================
   11. 密码锁
   ========================================================= */
const lockEl   = document.getElementById('lock');
const mainEl   = document.getElementById('main');
const pinCard  = document.querySelector('.lock-card');
const pinError = document.getElementById('pinError');
const pins     = [...document.querySelectorAll('#pin input')];

pins.forEach((el, i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 1);
    if (el.value && i < pins.length - 1) pins[i + 1].focus();
    verify();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0){
      e.preventDefault();
      pins[i - 1].focus();
      pins[i - 1].value = '';
    }
  });
  el.addEventListener('paste', e => {
    const txt = (e.clipboardData || window.clipboardData)
      .getData('text').replace(/\D/g, '').slice(0, 4);
    if (txt.length === 4){
      e.preventDefault();
      txt.split('').forEach((c, k) => pins[k].value = c);
      pins[3].focus();
      verify();
    }
  });
});

function verify(){
  if (unlocked) return;
  const val = pins.map(i => i.value).join('');
  if (val.length < 4) return;
  if (val === todayPassword()){
    unlock();
  } else {
    pinCard.classList.remove('shake');
    void pinCard.offsetWidth;
    pinCard.classList.add('shake');
    pinError.textContent = '密码不对哦，再想想～';
    pins.forEach(i => i.value = '');
    setTimeout(() => { pins[0].focus(); pinError.textContent = ''; }, 700);
  }
}

function unlock(){
  unlocked = true;
  lockEl.classList.add('gone');
  mainEl.classList.add('show');
  mainEl.setAttribute('aria-hidden', 'false');
  document.getElementById('topActions').classList.add('show');  // 优化 #13

  startTyping();
  if (window.__startHearts) window.__startHearts();
  if (window.__galleryReset) window.__galleryReset();

  // 优化 #5：iOS Safari 首次播放的"静音解锁"技巧
  loadTrack(0);
  try {
    audio.muted = true;
    const p = audio.play();
    if (p && p.then){
      p.then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        // 真正开始播放
        audio.play().then(() => {
          musicBtn.classList.remove('need-tap');
          initVisualizer();
          preloadNext();
        }).catch(() => {
          musicBtn.classList.add('need-tap');
          trackName.textContent = '点击播放音乐';
        });
      }).catch(() => {
        audio.muted = false;
        musicBtn.classList.add('need-tap');
        trackName.textContent = '点击播放音乐';
      });
    } else {
      audio.muted = false;
      playTrack(0);
    }
  } catch (_){
    audio.muted = false;
    playTrack(0);
  }
}

/* =========================================================
   12. 全局：可见性 / 右键 / 离开提醒 / Loader
   ========================================================= */

// 优化 #2：切后台暂停音乐和动画
document.addEventListener('visibilitychange', () => {
  pageHidden = document.hidden;
  if (pageHidden){
    if (!audio.paused){
      wasPlayingBeforeHidden = true;
      audio.pause();
    }
  } else {
    if (wasPlayingBeforeHidden && unlocked){
      audio.play().catch(() => {});
      wasPlayingBeforeHidden = false;
    }
  }
});

// 优化 #7：长按时阻止右键菜单（输入框除外）
document.addEventListener('contextmenu', (e) => {
  if (!unlocked) return;
  if (e.target.closest && e.target.closest('input, textarea')) return;
  e.preventDefault();
});

// 优化 #13：分享按钮
document.getElementById('shareBtn').addEventListener('click', async (e) => {
  e.stopPropagation();
  const url = location.href;
  const data = { title: '给你', text: '打开看看 ♡', url };
  try {
    if (navigator.share){
      await navigator.share(data);
    } else if (navigator.clipboard){
      await navigator.clipboard.writeText(url);
      alert('链接已复制，粘贴到微信发给我吧～');
    } else {
      prompt('复制下面的链接发给对方：', url);
    }
  } catch (_){ /* 用户取消 */ }
});

// 优化 #15：离开页面提醒（默认关）
if (WARN_BEFORE_LEAVE){
  window.addEventListener('beforeunload', (e) => {
    if (!unlocked) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });
}

// 优化 #11：Loader 隐藏
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loader').classList.add('gone');
  }, 350);
});

// 密码框自动聚焦
window.addEventListener('load', () => {
  if (window.innerWidth > 640) pins[0].focus();
});
</script>
